name: Build standalone executables

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install build tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pyinstaller>=6.16,<7'
          if [ "$RUNNER_OS" = Windows ]; then
            python -m pip install 'winrt-Windows.Networking.Connectivity>=3.2,<4' 'winrt-Windows.Networking.NetworkOperators>=3.2,<4'
          fi
      - name: Restore dedicated certificate from repository secrets
        shell: bash
        env:
          TLS_FULLCHAIN_B64: ${{ secrets.TLS_FULLCHAIN_B64 }}
          TLS_PRIVATE_KEY_B64: ${{ secrets.TLS_PRIVATE_KEY_B64 }}
        run: |
          python - <<'PY'
          import base64, os, pathlib
          cert = os.environ.get('TLS_FULLCHAIN_B64', '')
          key = os.environ.get('TLS_PRIVATE_KEY_B64', '')
          if not cert or not key:
              raise SystemExit('Set TLS_FULLCHAIN_B64 and TLS_PRIVATE_KEY_B64 repository secrets')
          dest = pathlib.Path('tls')
          dest.mkdir(exist_ok=True)
          (dest / 'fullchain.pem').write_bytes(base64.b64decode(cert, validate=True))
          (dest / 'privkey.pem').write_bytes(base64.b64decode(key, validate=True))
          PY
      - name: Run tests
        shell: bash
        run: python -m unittest discover -v
      - name: Build
        shell: bash
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: GeelyGalaxyADBUnlocker-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
